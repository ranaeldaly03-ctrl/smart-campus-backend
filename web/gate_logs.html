    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Gate Access Logs</title>
</head>
<body>
    <div class="menu">
        <ul>
            <li class="profile">
                <div class="img-box">
                    <img id="profilePic" src="" alt="profile">
                </div>

                <h2 id="adminName"></h2>
            </li>
            <li>
                <a href="admin.html">
                    <i class="fas fa-home"></i>
                    <p>dashboard</p>
                </a>
            </li>
            <li>
                <a href="users.html">
                    <i class="fas fa-user-group"></i>
                    <p>Users</p>
                </a>
            </li>
            <li>
                <a href="student_requests.html">
                    <i class="fas fa-user-check"></i>
                    <p>Student Requests</p>
                </a>
            </li>
            <li>
                <a href="courses.html">
                    <i class="fa fa-list-alt"></i>
                    <p>Courses</p>
                </a>
            </li>
            <li>
                <a href="admin_schedule.html">
                    <i class="fas fa-table"></i>
                    <p>Tables</p>
                </a>
            </li>
            <li>
                <a href="admin_gate.html">
                    <i class="fas fa-torii-gate"></i>
                    <p>Gate</p>
                </a>
            </li>
            <li>
                <a class="active" href="gate_logs.html">
                    <i class="fas fa-dungeon"></i>
                    <p>gate_logs</p>
                </a>
            </li>
            <li>
                <a href="register_card.html">
                    <i class="fas fa-id-card"></i>
                    <p>Cards</p>
                </a>
            </li>
            
            <li class="log-out">
                <a href="login.html">
                    <i class="fas fa-sign-out"></i>
                    <p>log Out</p>
                </a>
            </li>
        </ul>
    </div>

    <div class="container">
        <div class="title">
            <h1>🚪 Gate Access Logs</h1>
        </div>

        <button onclick="loadLogs()">Refresh</button>
    

        
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>RFID UID</th>
                    <th>Status</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="logsTable">
            </tbody>
        </table>

    </div>




    <script>

        const api = "http://127.0.0.1:5000";

        document.addEventListener("DOMContentLoaded", () => {
            const name = localStorage.getItem("user_name");
            const role = localStorage.getItem("user_role");
            const image = localStorage.getItem("user_image");


            if (!name || role !== "Admin") {
                window.location.href = "login.html";
                return;
            }
               
            document.getElementById("adminName").textContent = name;
                
            const profilePic = document.getElementById("profilePic");
            
             if (image && image !== "null" && image !== ""){
                    document.getElementById("profilePic").src = `${api}/${image}`;
                } else {
                    document.getElementById("profilePic").src = `${api}/uploads/admin.png`;
                }

            
        });

        function loadLogs() {
            fetch("http://192.168.197.52:5000/get_logs")
            .then(response => response.json())
            .then(data => {

                const table = document.getElementById("logsTable");
                table.innerHTML = "";

                data.forEach(log => {

                    const statusClass = log.access ? "granted" : "denied";
                    const statusText = log.access ? "Access Granted" : "Access Denied";

                    const row = `
                        <tr>
                            <td>${log.student_id ? log.student_id : "-"}</td>
                            <td>${log.rfid_uid}</td>
                            <td class="${statusClass}">${statusText}</td>
                            <td>${log.timestamp}</td>
                        </tr>
                    `;

                    table.innerHTML += row;
                });

            })
            .catch(error => {
                console.error("Error loading logs:", error);
            });
        }

        // تحميل أول مرة
        loadLogs();

        // تحديث كل 3 ثواني
        setInterval(loadLogs, 3000);

    </script>


</body>
</html>
