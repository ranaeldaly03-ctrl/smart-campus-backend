<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
    <title>Instructor Chat</title>
</head>
<body>
    <div class="menu">
        <ul>
            <li class="profile">
                <div class="img-box">
                    <img id="profilePic" src="" alt="profile">
                </div>

                <h2 id="ProfessorName"></h2>
            </li>
            <li>
                <a href="/Prof_DaskBoard">
                    <i class="fas fa-home"></i>
                    <p>dashboard</p>
                </a>
            </li>
            <li>
                <a href="/generate_qr">
                    <i class="fas fa-qrcode"></i>
                    <p>Generate QR</p>
                </a>
            </li>
            <li>
                <a href="/Prof_students">
                    <i class="fas fa-user-group"></i>
                    <p>Students</p>
                </a>
            </li>
            <li>
                <a href="/Prof_courses">
                    <i class="fa fa-list-alt"></i>
                    <p>Courses</p>
                </a>
            </li>
             <li><a href="/prof_assigment"><i class="far fa-edit"></i><p>Assignments</p></a></li>
            <li>
                <a href="/Prof_ads">
                    <i class="fab fa-adversal"></i>
                    <p>ADS</p>
                </a>
            </li>
            <li>
                <a href="/Prof_schedule">
                    <i class="fas fa-table"></i>
                    <p>Tables</p>
                </a>
            </li>

            <li>
              <a href="/prof_mid&final">
                <i class="fas fa-award"></i>
                <p>Midterm & Final</p>
              </a>
            </li>
            
            <li>
              <a class="active" href="/prof_chat">
                <i class="fas fa-comments"></i>
                <p>
                    Chat 
                    <span id="notifBadge"
                style="
                    display:inline-flex;
                    align-items:center;
                    justify-content:center;
                    min-width:18px;
                    height:18px;
                    background:red;
                    color:white;
                    border-radius:50%;
                    font-size:12px;
                    margin-left:6px;
                    padding:0 5px;">
            </span>
                </p>
              </a>
            </li>

            <li>
              <a href="/Prof_Proctoring">
                <i class="fas fa-video"></i>
                <p>Camera</p>
              </a>
            </li>
            
            <li class="log-out">
                <a href="/">
                    <i class="fas fa-sign-out"></i>
                    <p>log Out</p>
                </a>
            </li>
        </ul>
    </div>

    <div class="content">

        <div class="chat-layout">

            <div class="chat-users" id="studentsList"></div>

            <div class="chat-container">
                <div class="chat-header" id="chatHeader">
                    اختر طالب
                </div>

                <div class="chat-messages" id="messages"></div>

                <div class="chat-input">
                    <input type="text" id="msgInput" placeholder="اكتب ردك...">
                    <input type="file" id="fileInput" hidden>
                    <button type="button"
                            onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <button onclick="sendMessage()">إرسال</button>
                </div>
                <span id="fileName" style="font-size:12px;"></span>
            </div>

    </div>




    <script>
        const api="";
        const socket=io(api);

        const instructor_id = Number(localStorage.getItem("user_id"));
        let conversation_id=null;


        const profId = localStorage.getItem("user_id");
        const profName = localStorage.getItem("user_name");
        const profImage = localStorage.getItem("user_image");
        const profRole = localStorage.getItem("user_role");

        document.addEventListener("DOMContentLoaded", () => {
            if(!profName || profRole !== "Instructor"){
            window.location.href = "/";
            return;
            }

            document.getElementById("ProfessorName").textContent = profName;
            const pic = document.getElementById("profilePic");
            pic.src = profImage ? `${api}/${profImage}` : `/uploads/default.png`;

            loadStudents();

            document.getElementById("msgInput").addEventListener("keydown", e => {
                if (e.key === "Enter") sendMessage();
            });

            conversation_id = null; // 🔥 يبدأ فاضي

            setInterval(() => {
                console.log("Checking unread...");
                fetch(api + `/instructor/${instructor_id}/unread_count`)
                .then(res => res.json())
                .then(data => {
                    console.log("Unread:", data.unread);
                    document.getElementById("notifBadge").innerText =
                        data.unread > 0 ? data.unread : "";
                });
            }, 5000);
        });


        // ================= LOAD STUDENTS =================
        function loadStudents(){

            Promise.all([
                fetch(api + `/instructor/${instructor_id}/students`)
                    .then(res=>res.json()),

                fetch(api + `/instructor/${instructor_id}/unread_by_conversation`)
                    .then(res=>res.json())
            ])
            .then(([students, unreadData]) => {

                console.log("Students Data:", students);

                const list = document.getElementById("studentsList");
                list.innerHTML = "";

                students.forEach(item => {

                    const unreadObj = unreadData.find(
                        u => String(u.conversation_id) === String(item.conversation_id)
                    );

                    const unreadCount = unreadObj ? unreadObj.unread : 0;

                    const div = document.createElement("div");
                    div.className = "user-item";

                    div.innerHTML = `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px">
                            
                            <div style="display:flex;align-items:center;gap:10px">
                                <img src="${item.image ? api + '/' + item.image : api + '/uploads/admin.png'}"
                                    style="width:35px;height:35px;border-radius:50%">
                                <span>${item.name}</span>
                            </div>

                            ${unreadCount > 0 ? 
                                `<span style="background:red;color:white;border-radius:50%;padding:2px 6px;font-size:12px;">
                                    ${unreadCount}
                                </span>` 
                            : ""}
                        </div>
                    `;

                    div.onclick = () => {
                        openConversationWithStudent(item.id, item.name);
                    };

                    list.appendChild(div);
                });
            });
        }
        // ================= OPEN CONVERSATION =================
        function openConversationWithStudent(student_id, student_name){

            document.getElementById("chatHeader").innerText = "💬 " + student_name;

            fetch(api + "/start_conversation", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: student_id,
                    instructor_id: instructor_id
                })
            })
            .then(res => res.json())
            .then(data => {

                conversation_id = data.conversation_id;

                localStorage.setItem("conversation_id", conversation_id);  

                document.getElementById("messages").innerHTML = "";
                loadOldMessages();

                fetch(api + `/conversation/${conversation_id}/mark_read`, {
                    method: "PUT"
                }).then(() => {
                    updateUnread();
                });
            });
        }

        // ================= LOAD OLD MESSAGES =================
        function loadOldMessages() {

            if (!conversation_id) return;

            const box = document.getElementById("messages");
            box.innerHTML = ""; // 🔥 مهم جدًا

            fetch(api + "/conversation/" + conversation_id)
            .then(res => res.json())
            .then(data => {

                document.getElementById("messages").innerHTML = "";

                data.forEach(msg => {
                    addMessage(
                        msg.sender_id,
                        msg.message,
                        msg.is_read,
                        msg.file_path
                    );
                });
            });
        }

        // ================= RECEIVE LIVE =================
        socket.on("receive_message", function(data){

            if(data.conversation_id == conversation_id){

                addMessage(
                    data.sender_id,
                    data.message,
                    false,
                    data.file_url || null
                );

                // 🔥 الرسالة اتقرت
                fetch(api + `/conversation/${conversation_id}/mark_read`, {
                    method: "PUT"
                }).then(() => {
                    updateUnread();
                    loadStudents();
                });

            } else {
                // 🔥 رسالة في شات تاني
                loadStudents();   // يحدث القائمة
                updateUnread();   // يحدث الرقم فوق
            }
        });

        // ================= SEND MESSAGE =================
        async function sendMessage(){

            if (!conversation_id) {
                alert("اختاري طالب الأول");
                return;
            }

            const textInput = document.getElementById("msgInput");
            const fileInput = document.getElementById("fileInput");

            const text = textInput.value.trim();
            const file = fileInput.files[0];

            if (!text && !file) return;

            let file_url = null;

            // لو فيه فايل نرفعه الأول
            if(file){

                const formData = new FormData();
                formData.append("file", file);

                const res = await fetch(api + "/upload_chat_file", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();
                file_url = data.file_url;

                fileInput.value = "";
            }

            // نبعت الرسالة مرة واحدة عن طريق socket
            socket.emit("send_message",{
                conversation_id:conversation_id,
                sender_id:instructor_id,
                message:text || null,
                file_url:file_url
            });

            textInput.value = "";
        }

        // ================= ADD MESSAGE =================
        function addMessage(sender, message, is_read=false, file_url=null){

            const box = document.getElementById("messages");
            const div = document.createElement("div");

            if(sender == instructor_id){
                div.className = "message mine";
            } else {
                div.className = "message other";
            }

            let content = "";

            if(file_url){

                const filePath = `${api}/static/uploads/${file_url}`;

                if(file_url.match(/\.(jpg|jpeg|png|gif)$/i)){
                    content = `<img src="${filePath}" 
                                style="max-width:200px;border-radius:8px;">`;
                } else {
                    content = `<a href="${filePath}" target="_blank">
                                📎 Download File
                            </a>`;
                }

            } else {
                content = message;
            }

            if(sender == instructor_id){
                const seenIcon = is_read ? " ✔✔" : " ✔";
                div.innerHTML = content + seenIcon;
            } else {
                div.innerHTML = content;
            }

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        
        document.getElementById("fileInput").addEventListener("change", function(){
            const file = this.files[0];
            document.getElementById("fileName").innerText =
                file ? file.name : "";
        });
    </script>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>
</body>
</html>
