<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Take Quiz</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='stu_assigment.css') }}">

<style>

.quiz-box{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.quiz-box h3{
    margin-bottom:15px;
}

.option{
    display:block;
    margin:8px 0;
}

.submit-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="menu">
<ul>

<li class="profile">
<div class="img-box">
<img id="profilePic">
</div>
<h2 id="studentName"></h2>
</li>

<li><a href="/stu_dashboard"><i class="fas fa-home"></i><p>dashboard</p></a></li>
<li><a href="/stu_att"><i class="fas fa-qrcode"></i><p>Attendance</p></a></li>
<li><a href="/stu_courses"><i class="fa fa-list-alt"></i><p>Courses</p></a></li>
<li><a class="active"><i class="far fa-edit"></i><p>Quiz</p></a></li>

</ul>
</div>

<div class="content">

<div class="title-info">
<p>Quiz Exam</p>
<i class="fas fa-question-circle"></i>
</div>

<div id="quizContainer"></div>

<button class="submit-btn"
onclick="submitQuiz()">
Submit Quiz
</button>

<div id="result" class="result"></div>

</div>

<script>

const quizId =
localStorage.getItem("quiz_id");

const studentId =
localStorage.getItem("user_id");

document.getElementById("studentName")
.innerText =
localStorage.getItem("user_name");

document.getElementById("profilePic")
.src =
localStorage.getItem("user_image");

let questions=[];

async function loadQuiz(){

    const res =
    await fetch(`/quiz_questions/${quizId}`);

    questions =
    await res.json();

    let html="";

    questions.forEach(q=>{

        html+=`
        <div class="quiz-box">

        <h3>${q.question_text}</h3>
        `;

        let options=[];

        try{
            options=
            JSON.parse(q.options);
        }
        catch{
            options=[];
        }

        options.forEach((op,index)=>{

            html+=`
            <label class="option">

            <input
            type="radio"
            name="q${q.id}"
            value="${index+1}"
            >

            ${op}

            </label>
            `;
        });

        html+=`</div>`;
    });

    document.getElementById("quizContainer")
    .innerHTML=html;
}

loadQuiz();

async function submitQuiz(){

    let answers={};

    questions.forEach(q=>{

        let selected=
        document.querySelector(
        `input[name="q${q.id}"]:checked`
        );

        if(selected){

            answers[q.id]=
            selected.value;
        }
    });

    const res=
    await fetch("/submit_quiz_exam",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            student_id:studentId,

            assignment_id:quizId,

            answers:answers

        })
    });

    const data=
    await res.json();

    document.getElementById("result")
    .innerHTML=

    `Your Score:
    ${data.score}
    /
    ${data.total}`;
}

</script>

</body>
</html>
