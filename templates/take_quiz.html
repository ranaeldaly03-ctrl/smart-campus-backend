<div class="content">

<div class="title-info">
<p>Quiz Exam</p>
<i class="fas fa-question-circle"></i>
</div>

<div id="quizContainer"></div>

<button class="submit-btn"
onclick="submitQuiz()">
Submit Quiz
</button>

<div id="result" class="result"></div>

</div>

<script>

const quizId =
localStorage.getItem("quiz_id");

const studentId =
localStorage.getItem("user_id");

document.getElementById("studentName")
.innerText =
localStorage.getItem("user_name");

document.getElementById("profilePic")
.src =
localStorage.getItem("user_image");

let questions=[];

async function loadQuiz(){

    const res =
    await fetch(`/quiz_questions/${quizId}`);

    questions =
    await res.json();

    let html="";

    questions.forEach(q=>{

        html+=`
        <div class="quiz-box">

        <h3>${q.question_text}</h3>
        `;

        let options=[];

        try{
            options=
            JSON.parse(q.options);
        }
        catch{
            options=[];
        }

        options.forEach((op,index)=>{

            html+=`
            <label class="option">

            <input
            type="radio"
            name="q${q.id}"
            value="${index+1}"
            >

            ${op}

            </label>
            `;
        });

        html+=`</div>`;
    });

    document.getElementById("quizContainer")
    .innerHTML=html;
}

loadQuiz();

async function submitQuiz(){

    let answers={};

    questions.forEach(q=>{

        let selected=
        document.querySelector(
        `input[name="q${q.id}"]:checked`
        );

        if(selected){

            answers[q.id]=
            selected.value;
        }
    });

    const res=
    await fetch("/submit_quiz_exam",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            student_id:studentId,

            assignment_id:quizId,

            answers:answers

        })
    });

    const data=
    await res.json();

    document.getElementById("result")
    .innerHTML=

    `Your Score:
    ${data.score}
    /
    ${data.total}`;
}

</script>
