<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Chat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
</head>
<body>
    <div class="menu">
        <ul>
            <li class="profile">
                <div class="img-box">
                    <img id="profilePic" src="" alt="profile">
                </div>
                <h2 id="studentName"></h2>
            </li>

            <li><a href="/stu_dashboard"><i class="fas fa-home"></i><p>Dashboard</p></a></li>
            <li><a href="/stu_att"><i class="fas fa-qrcode"></i><p>Attendance</p></a></li>
            <li><a href="/stu_courses"><i class="fa fa-list-alt"></i><p>Courses</p></a></li>
            <li><a href="/stu_ads"><i class="fab fa-adversal"></i><p>ADS</p></a></li>
            <li><a href="/stu_schedule"><i class="fas fa-table"></i><p>Tables</p></a></li>
            <li><a href="/stu_assigment"><i class="fas fa-check-double"></i><p>Assignments</p></a></li>
            <li><a href="/stu_quiz"><i class="far fa-edit"></i><p>Quizzes</p></a></li>
            <li><a href="/stu_deg"><i class="fas fa-chart-line"></i><p>Degree</p></a></li>
            <li><a class="active" href="/stu_chat"><i class="fas fa-comments"></i>
                <p>
                    Chat 
                    <span id="notifBadge"
                    style="
                        display:inline-flex;
                        align-items:center;
                        justify-content:center;
                        min-width:18px;
                        height:18px;
                        background:red;
                        color:white;
                        border-radius:50%;
                        font-size:12px;
                        margin-left:6px;
                        padding:0 5px;">
                </span>
                </p>
                </a>
            </li>

            <li>
                <a href="/chatbot">
                    <i class="fab fa-github-alt"></i>
                    <p>AI</p>
                </a>
            </li>

            <li class="log-out">
                <a href="/"><i class="fas fa-sign-out"></i><p>Log Out</p></a>
            </li>
        </ul>
    </div>


    <div class="content">

        <div class="chat-layout">

            <div class="chat-users" id="instructorsList"></div>
            
            <div class="chat-container">
                <div class="chat-header" id="chatHeader">
                    اختر دكتور لبدء المحادثة
                </div>

                <div class="chat-messages" id="messages"></div>

                <div class="chat-input">
                    <input type="text" id="msgInput" placeholder="اكتب رسالتك...">
                    <input type="file" id="fileInput" hidden>
                    <button type="button"
                            onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <button onclick="sendMessage()">إرسال</button>
  
                </div>
                <span id="fileName" style="font-size:12px;"></span>
            </div>

        </div>

    </div>



    <script>
        const api = "";
        const socket = io();

        let student_id = null;
        let conversation_id = null;

        // ================== LOAD PAGE ==================
        document.addEventListener("DOMContentLoaded", () => {

            const name = localStorage.getItem("user_name");
            const role = localStorage.getItem("user_role");
            const image = localStorage.getItem("user_image");
            student_id = Number(localStorage.getItem("user_id"));

        conversation_id = null; // 🔥 يبدأ فاضي

            if (!name || role !== "Student") {
                window.location.href = "/";
                return;
            }

            document.getElementById("studentName").textContent = name;
            document.getElementById("profilePic").src =
                image ? `${api}/${image}` : `/uploads/admin.png`

            loadInstructors();

            document.getElementById("msgInput").addEventListener("keydown", e => {
                if (e.key === "Enter") sendMessage();
            });
        });

        // ================== LOAD INSTRUCTORS ==================
        function loadInstructors(){

            Promise.all([
                fetch(api + `/student/${student_id}/instructors`)
                    .then(res=>res.json()),
                fetch(api + `/student/${student_id}/unread_by_conversation`)
                    .then(res=>res.json())
            ])
            .then(([instructors, unreadData]) => {

                const list = document.getElementById("instructorsList");
                list.innerHTML = "";

                instructors.forEach(inst => {

                    const unreadObj = unreadData.find(
                        u => String(u.conversation_id) === String(inst.conversation_id)
                    );

                    const unreadCount = unreadObj ? unreadObj.unread : 0;

                    const div = document.createElement("div");
                    div.className = "user-item";

                    div.innerHTML = `
                        <div style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            padding:8px;
                            ${unreadCount>0 ? 'background:#f0f8ff;' : ''}">
                            
                            <div style="display:flex;align-items:center;gap:10px">
                                <img src="${inst.image ? api + '/' + inst.image : '/uploads/admin.png'}"
                                    style="width:35px;height:35px;border-radius:50%">
                                
                                <span style="font-weight:${unreadCount>0?'bold':'normal'}">
                                    ${inst.name}
                                </span>
                            </div>

                            ${unreadCount > 0 ? 
                                `<span style="
                                    background:red;
                                    color:white;
                                    border-radius:50%;
                                    padding:2px 6px;
                                    font-size:12px;">
                                    ${unreadCount}
                                </span>` 
                            : ""}
                        </div>
                    `;

                    div.onclick = () => {
                        openConversation(inst.id, inst.name);
                    };

                    list.appendChild(div);
                });
            })
            .catch(err => {
                console.log("Error loading instructors:", err);
            });
}

        // ================== OPEN CONVERSATION ==================
        function openConversation(instructor_id, instructor_name){

            document.getElementById("chatHeader").innerText = "💬 " + instructor_name;

            fetch(api + "/start_conversation", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: student_id,
                    instructor_id: instructor_id
                })
            })
            .then(res => res.json())
            .then(data => {

                conversation_id = data.conversation_id;

                localStorage.setItem("conversation_id", conversation_id);  

                socket.emit("join", { conversation_id });

                loadOldMessages();

                fetch(api + `/conversation/${conversation_id}/mark_read`, {
                    method: "PUT"
                }).then(() => {
                    updateUnread();
                    loadInstructors();
                });

            });  // يقفل then
            }    // يقفل function
        // ================== LOAD OLD MESSAGES ==================
        function loadOldMessages() {

            if (!conversation_id) return;

            const box = document.getElementById("messages");
            box.innerHTML = ""; // 🔥 مهم جدًا

            fetch(api + "/conversation/" + conversation_id)
            .then(res => res.json())
            .then(data => {
                data.forEach(msg => {
                    addMessage(
                        msg.sender_id,
                        msg.message,
                        msg.is_read,
                        msg.file_path
                    );
                });
            });
        }

        // ================== RECEIVE MESSAGE (LIVE) ==================
        socket.on("receive_message", function(data){

            if(data.conversation_id == conversation_id){

                addMessage(
                    data.sender_id,
                    data.message,
                    false,
                    data.file_url || null
                );

                fetch(api + `/conversation/${conversation_id}/mark_read`, {
                    method: "PUT"
                }).then(() => {
                    updateUnread();
                    loadInstructors(); // 🔥 مهم
                });

            } else {
                // 🔥 رسالة في شات تاني
                loadInstructors();   // يظهر الرقم الأحمر
                updateUnread();      // يحدث العداد فوق
            }
        });

        // ================== SEND MESSAGE ==================
        async function sendMessage(){
            
            console.log("conversation_id =", conversation_id);
            
            if (!conversation_id) {
                alert("اختاري محادثة الأول");
                return;
            }

            const textInput = document.getElementById("msgInput");
            const fileInput = document.getElementById("fileInput");

            const text = textInput.value.trim();
            const file = fileInput.files[0];

            // لو مفيش لا نص ولا فايل
            if (!text && !file) return;

            let file_url = null;

            // لو فيه فايل نرفعه الأول
            if(file){

                const formData = new FormData();
                formData.append("file", file);
                formData.append("conversation_id", conversation_id);
                formData.append("sender_id", student_id);

                const res = await fetch(api + "/upload_chat_file", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();
                file_url = data.file_url;

                fileInput.value = "";
            }

            // نبعته كله مرة واحدة عن طريق socket
            socket.emit("send_message",{
                conversation_id:conversation_id,
                sender_id: student_id,
                message:text || null,
                file_url:file_url
            });

            textInput.value = "";
        }

        // ================== ADD MESSAGE TO UI ==================
        function addMessage(sender, message, is_read=false, file_url=null){

            const box = document.getElementById("messages");
            const div = document.createElement("div");

            if(sender == student_id){
                div.className = "message mine";
            } else {
                div.className = "message other";
            }

            let content = "";

            if(file_url){

                const filePath = `${api}/static/uploads/${file_url}`;

                if(file_url.match(/\.(jpg|jpeg|png|gif)$/i)){
                    content = `
                        <img src="${filePath}" 
                            style="max-width:200px;border-radius:8px;">
                    `;
                } else {
                    content = `
                        <a href="${filePath}" target="_blank">
                            📎 Download File
                        </a>
                    `;
                }

            } else {
                content = message;
            }

            // 👇 ده الجزء المهم بتاع السين
            if(sender == student_id){

                const seenIcon = is_read ? " ✔✔" : " ✔";
                div.innerHTML = content + seenIcon;

            } else {
                div.innerHTML = content;
            }

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById("fileInput").addEventListener("change", function(){
            const file = this.files[0];
            document.getElementById("fileName").innerText =
                file ? file.name : "";
        });
                
    </script>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>
</body>
</html>
