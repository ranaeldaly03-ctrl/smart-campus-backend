<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AI Smart Campus Assistant</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
   <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="menu">
        <ul>
            <li class="profile">
                <div class="img-box">
                    <img id="profilePic" src="" alt="profile">
                </div>

            </li>

            <li><a href="/stu_dashboard"><i class="fas fa-home"></i><p>Dashboard</p></a></li>
            <li><a href="/stu_att"><i class="fas fa-qrcode"></i><p>Attendance</p></a></li>
            <li><a href="/stu_courses"><i class="fa fa-list-alt"></i><p>Courses</p></a></li>
            <li><a href="/stu_ads"><i class="fab fa-adversal"></i><p>ADS</p></a></li>
            <li><a href="/stu_schedule"><i class="fas fa-table"></i><p>Tables</p></a></li>
            <li><a href="/stu_assigment"><i class="fas fa-check-double"></i><p>Assignments</p></a></li>
            <li><a href="/stu_quiz"><i class="far fa-edit"></i><p>Quizzes</p></a></li>
            <li><a href="/stu_deg"><i class="fas fa-chart-line"></i><p>Degree</p></a></li>
            <li><a href="/stu_chat"><i class="fas fa-comments"></i>
                <p>
                    Chat 
                    <span id="notifBadge"
                    style="
                        display:inline-flex;
                        align-items:center;
                        justify-content:center;
                        min-width:18px;
                        height:18px;
                        background:red;
                        color:white;
                        border-radius:50%;
                        font-size:12px;
                        margin-left:6px;
                        padding:0 5px;">
                </span>
                </p>
                </a>
            </li>

            <li>
                <a class="active" href="/chatbot">
                    <i class="fab fa-github-alt"></i>
                    <p>AI</p>
                </a>
            </li>

            <li class="log-out">
                <a href="/"><i class="fas fa-sign-out"></i><p>Log Out</p></a>
            </li>
        </ul>
    </div>


<!-- ================= CONTENT ================= -->
<div class="content">

    <div class="title-info">
        <p>🤖 AI Smart Campus Assistant</p>
    </div>

    <!-- ===== INTRO ===== -->
    <div class="ai-intro" id="aiIntro">
        <div class="orb"></div>
        <h2>أهلًا 👋</h2>
        <p>اسألني عن جدولك، درجاتك، الغياب…</p>
    </div>




    <!-- ===== CHAT ===== -->
    <div class="chat-messages hidden" id="messages"></div>


    <!-- ===== QUICK OPTIONS ===== -->
<div class="quick-buttons" id="quickBtns">
    <button onclick="quickAsk('غبت كام مرة؟')">📊 الغياب</button>
    <button onclick="quickAsk('درجاتي عاملة ايه؟')">📈 الدرجات</button>
    <button onclick="quickAsk('أسجل مواد ايه؟')">🎓 المواد</button>
    <button onclick="quickAsk('جدولي ايه؟')">📅 الجدول</button>
    <button onclick="quickAsk('لخص المحاضره')">📚 لخص محاضرة</button>
    <button onclick="generateQuiz()">Generate Quiz</button>
</div>

<!-- ===== INPUT ===== -->
<!-- ===== UPLOAD LECTURE ===== -->
<div class="upload-lecture">
    <input type="file" id="lectureFile" accept="application/pdf">
    <button type="button" id="uploadBtn">📎 رفع المحاضرة</button>
</div>

<!-- ===== CHAT INPUT ===== -->
<div class="chat-input">
    <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." />
    <button type="button" onclick="sendMessage()">إرسال</button>
</div>

<div id="quizBox"></div>

    
</div>

<!-- ================= SCRIPT ================= -->
    <script>
        const api = "";
        const API_URL = "/ai/chat";
        const student_id = localStorage.getItem("user_id") || 1;

        // -------- Load student info --------
        document.addEventListener("DOMContentLoaded", () => {
            const name = localStorage.getItem("user_name");
            const role = localStorage.getItem("user_role");
            const image = localStorage.getItem("user_image");

            if (!name || role !== "Student") {
                window.location.href = "/";
                return;
            }

            document.getElementById("studentName").textContent = name;
            document.getElementById("profilePic").src =
                image ? `${api}/${image}` : `${api}/uploads/admin.png`;

           

            // chat input enter
            document.getElementById("userInput").addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById("uploadBtn").addEventListener("click", function(e){
                e.preventDefault();
                uploadLecture();
            });
        });





        // ===== INTRO → CHAT =====
        function startChat(text) {
            document.getElementById("aiIntro").classList.add("hidden");
            document.getElementById("messages").classList.remove("hidden");
            document.querySelector(".chat-input").classList.remove("hidden");
            document.getElementById("quickBtns").classList.remove("hidden");

            addMessage(text, "user");
            sendToAI(text);
        }

        // ===== SEND MESSAGE =====
        function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            // 👈 أول رسالة؟ نخفي الـ Intro
            if (!document.getElementById("aiIntro").classList.contains("hidden")) {
                document.getElementById("aiIntro").classList.add("hidden");
                document.getElementById("messages").classList.remove("hidden");
                document.getElementById("quickBtns").classList.remove("hidden");
            }

            addMessage(text, "user");
            input.value = "";
            sendToAI(text);
        }


        // ===== QUICK ASK =====
        function quickAsk(text) {
            addMessage(text, "user");
            sendToAI(text);
        }

        // ===== API CALL =====
        function sendToAI(text) {
            showTyping();

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    student_id: student_id,
                    message: text
                })
            })
            .then(res => res.json())
            .then(data => {
                console.log("AI:", data);

                addMessage(data.reply, "bot");

                if (data.questions) {
                    showQuiz(data.questions);
                }
            })
            .catch(() => {
                removeTyping();
                addMessage("❌ حصل خطأ في الاتصال بالسيرفر", "bot");
            });
        }

        // ===== UI HELPERS =====
        function addMessage(text, sender) {
            const messages = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `message ${sender}`;

            // 👇 الحل النهائي
            if (typeof text === "object") {
                if (text.reply) {
                    text = text.reply;
                } else {
                    text = JSON.stringify(text);
                }
            }

            div.innerHTML = text.replace(/\n/g, "<br>");
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }


        function showTyping() {
            const div = document.createElement("div");
            div.id = "typing";
            div.className = "message bot";
            div.innerText = "⏳ AI بيفكر...";
            document.getElementById("messages").appendChild(div);
        }

        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }


        async function generateQuiz(){

            const response = await fetch("/ai/chat",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    student_id: student_id,
                    message: "اختبرني"   // 👈 عربي عشان detect_intent
                })
            });

            const data = await response.json();

            console.log("QUIZ:", data); // 👈 debug

            showQuiz(data.questions);
        }


        function showQuiz(questions){

            const box = document.getElementById("quizBox");

            // 👇 مهم جدًا
            box.innerHTML = "";

            if (!questions || questions.length === 0) {
                box.innerHTML = "<p>❌ مفيش أسئلة</p>";
                return;
            }

            questions.forEach((q,index)=>{

                let html = `
                <div class="question" data-answer="${q.answer}">
                    <h4>${index+1}. ${q.question}</h4>
                `;

                q.options.forEach(opt=>{
                    html += `
                    <label>
                        <input type="radio" name="q${index}" value="${opt}">
                        ${opt}
                    </label><br>
                    `;
                });

                html += "</div>";

                box.innerHTML += html;

            });

            // 👇 الزرار في الآخر بس
            box.innerHTML += `
                <br>
                <button onclick="submitQuiz()" class="submit-btn">
                    Submit Quiz
                </button>
            `;
        }


        async function uploadLecture(){

            const fileInput = document.getElementById("lectureFile");
            const file = fileInput.files[0];

            if(!file){
                alert("اختاري ملف PDF");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            formData.append("student_id", student_id);

            // 👇 تظهر أثناء الرفع
            addMessage("⏳ جاري رفع المحاضرة...", "bot");

            try{

                const response = await fetch("/upload_lecture_ai",{
                    method:"POST",
                    body:formData
                });

                const data = await response.json();

                document.getElementById("aiIntro").classList.add("hidden");
                document.getElementById("messages").classList.remove("hidden");

                addMessage("📎 تم رفع محاضرة", "user");
                addMessage(data.reply,"bot");

                fileInput.value = "";   // مسح الملف بعد الرفع

            }catch(error){

                addMessage("❌ حصل خطأ أثناء رفع الملف","bot");

            }
        }


        function submitQuiz(){

            const questions = document.querySelectorAll(".question");

            let score = 0;
            let total = questions.length;

            if(total === 0){
                addMessage("❌ مفيش أسئلة", "bot");
                return;
            }

            questions.forEach((q,index)=>{

                const selected = document.querySelector(`input[name="q${index}"]:checked`);


                console.log("SELECTED VALUE =", selected.value);
                console.log("DATA ANSWER =", correct);

                if(!selected) return;

                const correct = q.getAttribute("data-answer");

                // 👇 الحل هنا
                const userAnswer = selected.value.trim().toLowerCase();
                const correctAnswer = correct.trim().toLowerCase();

                console.log("USER:", userAnswer);
                console.log("CORRECT:", correctAnswer);

                if(userAnswer === correctAnswer){
                    score++;
                }

            });

            addMessage(`🎓 نتيجتك: ${score} / ${total}`, "bot");
        }
    </script>

</body>
</html>
