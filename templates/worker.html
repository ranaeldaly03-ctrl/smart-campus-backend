<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='robot.css') }}">
  <title>Worker Panel</title>

  <style>
    body {
      font-family: 'Segoe UI';
      background: #f4f7fb;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #2E86AB;
    }

    .order {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
    }

    .ready {
      background: #10B981;
      color: white;
    }

    .open {
      background: #3B82F6;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>☕ Worker Panel</h1>

  <div id="orders">Loading...</div>

</div>
<script>

const BASE = "";

async function loadOrders()
{
    const res = await fetch(BASE + "/robot/get_order");
    const orders = await res.json();

    const container = document.getElementById("orders");

    container.innerHTML = "";

    if (orders.length === 0)
    {
        container.innerHTML =
            "<p>No waiting orders 😴</p>";
        return;
    }

    orders.forEach(order =>
    {
        container.innerHTML += `
        <div class="order">

            <b>Order #${order.id}</b><br>
            <b>Item:</b> ${order.item}<br>
            <b>Lat:</b> ${order.lat}<br>
            <b>Lon:</b> ${order.lon}<br>
            <b>Status:</b> ${order.status}<br><br>

            <button class="btn ready"
                onclick="approveOrder(${order.id})">
                ✅ Approve
            </button>

        </div>
        `;
    });
}

async function approveOrder(id)
{
    const res = await fetch(
        BASE + "/robot/approve/" + id,
        {
            method: "POST"
        }
    );

    const data = await res.json();

    alert(data.message);

    loadOrders();
}

loadOrders();

setInterval(loadOrders, 3000);

</script>
</body>
</html>
