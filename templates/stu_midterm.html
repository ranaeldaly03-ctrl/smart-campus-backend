<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='stu_att.css') }}">
    <title>Midterm Grades</title>
</head>
<body>
    <div class="menu">

                </div>

            </li>
            <li>

                    <i class="fas fa-home"></i>

                </a>
            </li>
            <li>
                <a href="/stu_att">
                    <i class="fas fa-qrcode"></i>
                    <p>Attendance</p>
                </a>
            </li>
            <li>
                <a href="/stu_courses">
                    <i class="fa fa-list-alt"></i>
                    <p>Courses</p>
                </a>
            </li>
            <li>
                <a href="/stu_ads">
                    <i class="fab fa-adversal"></i>
                    <p>ADS</p>
                </a>
            </li>
            <li>
                <a href="/stu_schedule">
                    <i class="fas fa-table"></i>
                    <p>Tables</p>
                </a>
            </li>
            <li>
                <a href="/stu_assigment">
                    <i class="fas fa-check-double"></i>
                    <p>Assignments</p>
                </a>
            </li>
            <li>
                <a href="/stu_quiz">
                    <i class="far fa-edit"></i>
                    <p>Quizzes</p>
                </a>
            </li>
            <li>
                <a href="/stu_deg">
                    <i class="fas fa-chart-line"></i>
                    <p>Degree</p>
                </a>
            </li>
            <li>
                <a class="active" href="/stu_midterm">
                    <i class="fas fa-star"></i>
                    <p>Midterm</p>
                </a>
            </li>

            <li><a href="/stu_chat"><i class="fas fa-comments"></i>
                <p>
                    Chat 
                    <span id="notifBadge"
                        style="
                            display:inline-flex;
                            align-items:center;
                            justify-content:center;
                            min-width:18px;
                            height:18px;
                            background:red;
                            color:white;
                            border-radius:50%;
                            font-size:12px;
                            margin-left:6px;
                            padding:0 5px;">
                    </span>
                </p>
                </a>
            </li>

             <li>
                <a href="/chatbot">
                    <i class="fab fa-github-alt"></i>
                    <p>Ai</p>
                </a>
            </li>

            <li>
                <a href="/robot">
                    <i class="fas fa-robot"></i>
                  <p>CampusBot</p>
                    
                </a>
            </li>

            <li>
                <a href="/track">
                    <i class="fas fa-box-open"></i>
                    <p>Track Order</p>
                </a>
            </li>
            
            <li class="log-out">
                <a href="/">
                    <i class="fas fa-sign-out"></i>
                    <p>log Out</p>
                </a>
            </li>
        </ul>
    </div>

    <div class="content">
        <div class="title-info">
            <h2>Midterm Grades</h2>
            <i class="fas fa-star"></i>
        </div>


        <div class="table-card">
            <table>
                <thead>
                <tr>
                    <th>Course</th>
                    <th>Midterm Grade</th>
                </tr>
                </thead>
                <tbody id="gradesTable">
                <!-- Grades will appear here -->
                </tbody>
            </table>
    </div>


    <script>
        const API_URL = "";

        document.addEventListener("DOMContentLoaded", () => {

        /* =============================
            1️⃣ Get student data
        ============================== */
        const studentId   = localStorage.getItem("user_id");
        const studentName = localStorage.getItem("user_name");
        const studentRole = localStorage.getItem("user_role");
        const studentImage = localStorage.getItem("user_image");

        if (!studentId || studentRole !== "Student") {
            window.location.href = "/";
            return;
        }

        /* =============================
            2️⃣ Set profile info
        ============================== */
        document.getElementById("studentName").textContent = studentName || "Student";

        const profilePic = document.getElementById("profilePic");
        profilePic.src =
            studentImage && studentImage !== "null"
            ? `${API_URL}/${studentImage}`
            : `/uploads/default.png`;

        /* =============================
            3️⃣ Load midterm grades
        ============================== */
        loadMidtermGrades(studentId);
        });

        /* =============================
        4️⃣ Fetch midterm grades API
        ============================== */
        function loadMidtermGrades(studentId) {
        const tableBody = document.getElementById("gradesTable");
        tableBody.innerHTML = `
            <tr>
            <td colspan="2" class="no-grade">Loading...</td>
            </tr>
        `;

        fetch(`${API_URL}/student/${studentId}/midterm`)
            .then(response => response.json())
            .then(data => {

            if (!data.ok || !data.midterms || data.midterms.length === 0) {
                tableBody.innerHTML = `
                <tr>
                    <td colspan="2" class="no-grade">No grades available</td>
                </tr>
                `;
                return;
            }

            tableBody.innerHTML = "";

            data.midterms.forEach(item => {
                const grade =
                item.mid_grade !== null && item.mid_grade !== undefined
                    ? item.mid_grade
                    : "Not Available";

                const row = document.createElement("tr");
                row.innerHTML = `
                <td>${item.course_name}</td>
                <td class="${grade === "Not Available" ? "no-grade" : ""}">
                    ${grade}
                </td>
                `;

                tableBody.appendChild(row);
            });
            })
            .catch(error => {
            console.error("❌ Error loading midterm grades:", error);
            tableBody.innerHTML = `
                <tr>
                <td colspan="2" class="no-grade">Error loading grades</td>
                </tr>
            `;
            });
        }

    </script>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>

</body>
</html>
