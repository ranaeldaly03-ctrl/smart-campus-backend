<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctoring</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{{ url_for('static', filename='Prof_students.css') }}">
</head>
<body>
    <div class="menu">
        <ul>
            <li class="profile">
                <div class="img-box">
                    <img id="profilePic" src="" alt="profile">
                </div>

                <h2 id="ProfessorName"></h2>
            </li>
            <li>
                <a href="/Prof_DaskBoard">
                    <i class="fas fa-home"></i>
                    <p>dashboard</p>
                </a>
            </li>
            <li>
                <a href="/generate_qr">
                    <i class="fas fa-qrcode"></i>
                    <p>Generate QR</p>
                </a>
            </li>
            <li>
                <a href="/Prof_students">
                    <i class="fas fa-user-group"></i>
                    <p>Students</p>
                </a>
            </li>
            <li>
                <a href="/Prof_courses">
                    <i class="fa fa-list-alt"></i>
                    <p>Courses</p>
                </a>
            </li>
             <li><a href="/prof_assigment"><i class="far fa-edit"></i><p>Assignments</p></a></li>
            <li>
                <a href="/Prof_ads">
                    <i class="fab fa-adversal"></i>
                    <p>ADS</p>
                </a>
            </li>
            <li>
                <a href="/Prof_schedule">
                    <i class="fas fa-table"></i>
                    <p>Tables</p>
                </a>
            </li>

            <li>
              <a href="/prof_mid&final">
                <i class="fas fa-award"></i>
                <p>Midterm & Final</p>
              </a>
            </li>

            <li>
              <a class="active" href="/Prof_Proctoring">
                <i class="fas fa-video"></i>
                <p>Camera</p>
              </a>
            </li>

            <li>
                <a href="/robot">
                    CampusBot
                </a>
            </li>

            <li>
                <a href="/track">
                    Track Order
                </a>
            </li>
            
            <li class="log-out">
                <a href="/">
                    <i class="fas fa-sign-out"></i>
                    <p>log Out</p>
                </a>
            </li>
        </ul>
    </div>

    <div class="content">

        <div class="title-info">
            <p>Online Proctoring</p>
        </div>

        <div class="box">

            <!-- Live Stream -->
            <div style="margin-top:20px;">
                <h3>Live Monitoring</h3>
                <img
                    id="videoFeed"
                    src="/video_feed"
                    alt="Live Camera"
                    style="width:100%; max-width:700px; border:2px solid #ccc;"
                >

            </div>

            <!-- Cheating Table -->
            <div style="margin-top:30px;">
                <h3>Cheating Logs</h3>
                <table id="cheatTable">
                    <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Behavior</th>
                        <th>Confidence</th>
                        <th>Time</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- JS -->
                    </tbody>
                </table>
            </div>

        </div>

    </div>


    <script>
            const API_URL = "";

            const profId = localStorage.getItem("user_id");
            const profName = localStorage.getItem("user_name");
            const profRole = localStorage.getItem("user_role");
            const profImage = localStorage.getItem("user_image");

            // ===============================
            // DOM READY
            // ===============================
            document.addEventListener("DOMContentLoaded", () => {

                // تحقق من تسجيل الدخول
                if (!profName || profRole !== "Instructor") {
                    window.location.href = "/";
                    return;
                }

                // اسم الدكتور
                const nameEl = document.getElementById("ProfessorName");
                if (nameEl) nameEl.textContent = profName;

                // صورة البروفايل
                const profilePic = document.getElementById("profilePic");
                if (profilePic) {
                    if (profImage && profImage !== "null" && profImage !== "") {
                        profilePic.src = profImage.startsWith("http")
                            ? profImage
                            : `${API_URL}/${profImage}`;
                    } else {
                        profilePic.src = `${API_URL}/uploads/admin.png`;
                    }
                }
            });

            // ===============================
            // CAMERA CONTROL
            // ===============================
            

            

            // ===============================
            // CHEATING LOGS TABLE
            // ===============================
            setInterval(() => {
                fetch(API_URL + "/cheating_logs")
                    .then(res => res.json())
                    .then(data => {
                        const tbody = document.querySelector("#cheatTable tbody");
                        if (!tbody) return;

                        tbody.innerHTML = "";

                        data.forEach(row => {
                            const tr = document.createElement("tr");

                            tr.innerHTML = `
                                <td>${row.student_id}</td>
                                <td>${row.behavior}</td>
                                <td>${row.confidence}</td>
                                <td>${row.created_at}</td>
                            `;

                            tbody.appendChild(tr);
                        });
                    })
                    .catch(err => console.error("Cheating logs error:", err));
            }, 3000);
    </script>

</body>
</html>
